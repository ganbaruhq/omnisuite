name: Check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both browser suites use the same Playwright Chromium installation.
      - run: pnpm --filter @omnisuite/calendar-example exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm verify-ui-package
      - run: pnpm --filter @omnisuite/storybook build
